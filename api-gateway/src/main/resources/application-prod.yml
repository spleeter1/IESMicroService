spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:

        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/users/**
          filters:
            - StripPrefix=1

        - id: import-order-service
          uri: lb://import-order-service
          predicates:
            - Path=/import-orders/**
          filters:
            - StripPrefix=1

        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/orders/**
          filters:
            - StripPrefix=1

        - id: statistic-service
          uri: lb://statistic-service
          predicates:
            - Path=/statistics/**
          filters:
            - StripPrefix=1

        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/products/**
          filters:
            - StripPrefix=1

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400} # fallback nếu biến môi trường chưa có

server:
  port: ${SERVER_PORT:8080}

eureka:
  instance:
    prefer-ip-address: true
    hostname: ${EUREKA_HOSTNAME}
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_SERVER:http://eureka-server:8761/eureka/}

logging:
  level:
    org.springframework.cloud.gateway: INFO
    reactor.netty: INFO
    com.api_gateway: INFO

management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always
  health:
    eureka:
      enabled: true
